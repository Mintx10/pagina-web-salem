<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jeans SLM ✨ | Indumentaria Salem 🐈‍⬛ - Tienda Oficial</title>
    
    <!-- Metatags SEO & Redes Sociales -->
    <meta name="description" content="Tienda online oficial de Jeans SLM e Indumentaria Salem. Vestí con estilo, sentite única. Jeans tiro alto, corsets, camperas puffer y venta mayorista y minorista a todo el país." />
    <meta property="og:title" content="Jeans SLM ✨ | Indumentaria Salem 🐈‍⬛" />
    <meta property="og:description" content="Mayorista y minorista. Vestí con estilo, sentite única. Envíos a toda Argentina." />
    <meta property="og:image" content="brand/logo.png" />
    <meta property="og:type" content="website" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" href="brand/logo.png" />
    <link rel="apple-touch-icon" href="brand/logo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#db2777" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jeans SLM" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global Error Handler -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('Global error:', e);
        var r = document.getElementById('root');
        if (r && (!r.querySelector('header') && !r.querySelector('nav'))) {
          setTimeout(function() {
            if (r && (!r.querySelector('header') && !r.querySelector('nav'))) {
              r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAF7F2;padding:24px;font-family:sans-serif;text-align:center;"><div style="background:white;padding:32px;border-radius:24px;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,0.08);border:1px solid #fbcfe8;"><div style="font-size:36px;margin-bottom:12px;">🐈‍⬛</div><h2 style="font-size:20px;font-weight:bold;color:#1c1917;margin-bottom:8px;">Indumentaria Salem ✨</h2><p style="font-size:13px;color:#78716c;margin-bottom:20px;">Aviso al cargar: <br><code style="color:#e11d48;font-size:11px;">' + (e.message || 'Error al iniciar') + '</code></p><button onclick="location.reload()" style="background:#db2777;color:white;border:none;padding:12px 24px;border-radius:12px;font-weight:bold;cursor:pointer;">Recargar Tienda</button></div></div>';
            }
          }, 800);
        }
      });
    </script>

    <!-- Tailwind CSS (Local Vendor prioritario, sin depender de CDN externo) -->
    <script src="vendor/tailwind.js"></script>
    <script>
      function configureTailwind() {
        if (typeof tailwind !== 'undefined') {
          tailwind.config = {
            theme: {
              extend: {
                colors: {
                  salem: {
                    50: '#fdf2f8',
                    100: '#fce7f3',
                    200: '#fbcfe8',
                    300: '#f9a8d4',
                    400: '#f472b6',
                    500: '#ec4899',
                    600: '#db2777',
                    700: '#be185d',
                    800: '#9d174d',
                    900: '#831843',
                  }
                },
                fontFamily: {
                  sans: ['Plus Jakarta Sans', 'sans-serif'],
                  display: ['Space Grotesk', 'sans-serif'],
                }
              }
            }
          };
        }
      }
      configureTailwind();
    </script>

    <!-- Canvas Confetti -->
    <script src="vendor/confetti.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-[#FAF7F2] text-[#1C1917] selection:bg-pink-200 selection:text-pink-900 antialiased overflow-x-hidden min-h-screen">
    
    <!-- React Root -->
    <div id="root">
      <!-- Loading Skeleton antes de montar React -->
      <div class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#FAF7F2]">
        <div class="w-16 h-16 rounded-full border-4 border-pink-200 border-t-pink-600 animate-spin mb-4"></div>
        <h2 class="font-display font-bold text-lg text-stone-800">Cargando Jeans SLM ✨...</h2>
        <p class="text-xs text-stone-500 mt-1">Indumentaria Salem 🐈‍⬛</p>
      </div>
    </div>

    <!-- React 18 & ReactDOM 18 (Local con fallback a CDN) -->
    <script src="vendor/react.min.js"></script>
    <script>
      window.React || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"><\/script>');
    </script>
    <script src="vendor/react-dom.min.js"></script>
    <script>
      window.ReactDOM || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"><\/script>');
    </script>

    <!-- Datos y Configuración de Salem -->
    <script src="data/products.js"></script>
    <script src="data/config.js"></script>

    <!-- Código React Precompilado de la App (Ejecuta directo) -->
    <script src="app.bundle.js"></script>

    <!-- Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
  </body>
</html>
